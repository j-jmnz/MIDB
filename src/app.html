<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#7400b8" />
		<script>
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				// Tint the mobile browser chrome with the active theme's --brand
				// (#7400b8 light, #c890ee dark). Resolve a manual override first,
				// else follow the system preference
				var dark =
					t === 'dark' ||
					(t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute('content', dark ? '#c890ee' : '#7400b8');
			} catch (_) {}
		</script>
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
